name: Build Mufakarti APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        run: |
          echo "Files in repository:"
          ls -la

          ZIP_FILE=$(find . -maxdepth 2 -type f \( -iname "*.zip" \) | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found!"
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$ROOT"

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x "$ROOT/gradlew"

      - name: Build APK
        working-directory: ${{ env.ROOT }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mufakarti-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
